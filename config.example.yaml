auth:
  # Общий секрет QUIC-меша между нодами. API его больше не использует.
  # Все ноды флота должны иметь одинаковый secret_key.
  # Сгенерировать: openssl rand -base64 48. Минимум 16 символов.
  secret_key: "CHANGE_ME_random_secret_min_16_chars"

tun:
  mtu: 1376 # Всегда должен быть меньше наименьшего транспорта
  iface_in_name: "liberator"
  iface_out_name: ""
router:
  transports:
    amnesiav2:
      type: "awg"
      protocol: "amnesiav2"
      mtu: 1376
      listen_port: 2200
      # Приватный ключ сервера AmneziaWG (32 байта hex). Сгенерировать свой
      # (openssl rand -hex 32), не переиспользовать. В git/k8s ConfigMap не
      # хранится: в кластере приходит из Secret node-awg-secret через
      # initContainer пода (см. infrastructure-manifests/SECURITY.md).
      private_key: "CHANGE_ME_32byte_hex_private_key"
      watchdog_interval: "30s"

      h1: "1245955480-1579617642"
      h2: "1827874969-1854585193"
      h3: "2137919667-2143439009"
      h4: "2147159423-2147402519"

      jc: 5
      jmin: 70
      jmax: 120

      s1: 48
      s2: 27
      s3: 30
      s4: 7

      # Опциональные signature/junk-пакеты AmneziaWG 1.5+/2.0.
      # Должны совпадать у сервера и клиента; пустые значения не применяются.
      i1: ""
      i2: ""
      i3: ""
      i4: ""
      i5: ""

    amnesiav31:
      type: "awg"
      protocol: "amnesiav31"
      mtu: 1376
      listen_port: 2201
      # Для 3.1 нужен отдельный ключ и отдельный порт.
      private_key: "CHANGE_ME_32byte_hex_private_key_v31"
      watchdog_interval: "30s"

      h1: "1245955480-1579617642"
      h2: "1827874969-1854585193"
      h3: "2137919667-2143439009"
      h4: "2147159423-2147402519"

      jc: 5
      jmin: 70
      jmax: 120

      # При header_protection_key все S1..S4 должны быть >= 12.
      s1: 48
      s2: 27
      s3: 30
      s4: 13

      i1: ""
      i2: ""
      i3: ""
      i4: ""
      i5: ""

      # AWG 3.1. Ключ хранится в base64 (как в клиентском URI).
      # Сгенерировать: awg genkey.
      header_protection_key: "CHANGE_ME_32byte_base64_header_key"
      content_padding_addition: "0-32"
      rekey_after_time: "120-180"
      rekey_timeout: "5-10"
      reject_after_time: "180-240"
      keepalive_timeout: "10-25"
      max_handshake_attempts: "10-15"
      random_trailers: true
      disable_cookies: true

    # VLESS+REALITY и Hysteria2 через внешний Xray-core. Нода запускает
    # `xray run`, забирает расшифрованный трафик из proxy_tun и дальше
    # обрабатывает его общим роутером (firewall/egress/usage/mesh).
    # Пользователи пока задаются статически: control-plane не умеет выдавать
    # proxy-сессии. virtual_ip не должен пересекаться с IP, которые выдаёт API.
    xray:
      type: "xray"
      binary: "/usr/local/bin/xray"
      mtu: 1376
      proxy_tun: "liberator-proxy"
      dummy: "liberator-proxy-dummy"
      state_dir: "/var/lib/liberator"
      # Диапазон policy-routing таблиц/приоритетов; должен быть свободен.
      route_table_base: 20000
      rule_priority_base: 20000
      # Пул локальных source-IP для Xray. Назначаются /32 на dummy-интерфейс
      # и не должны пересекаться с overlay и реальными сетями.
      local_cidr: "198.18.0.0/15"
      inbounds:
        - protocol: "vless"
          listen: "0.0.0.0"
          port: 443
          dest: "www.microsoft.com:443"
          # Приватный ключ REALITY в base64url (xray x25519).
          private_key: "CHANGE_ME_reality_private_key_base64url"
          server_names: ["www.microsoft.com"]
          short_ids: ["0123456789abcdef"]
          flow: "xtls-rprx-vision"
        - protocol: "hysteria2"
          listen: "0.0.0.0"
          port: 8443
          cert_file: "/certs/fullchain.pem"
          key_file: "/certs/key.pem"
          sni: "vpn.example.com"
      users:
        - name: "alice@example.com"
          protocol: "vless"
          # UUID (xray uuid).
          auth: "CHANGE_ME_uuid"
          virtual_ip: "100.64.0.10"
        - name: "bob@example.com"
          protocol: "hysteria2"
          # Пароль Hysteria2.
          auth: "CHANGE_ME_hysteria2_password"
          virtual_ip: "100.64.0.11"

dns:
  enabled: true
  # auto = gateway IP ноды (клиенты получают его в AWG-конфиге).
  listen_addr: "auto"
  listen_port: 53
  upstreams:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
    - "9.9.9.9:53"
  timeout: "2s"
  cache:
    ttl: "5m"
    max_entries: 10000

# Нужно только когда api.base_url пуст (локальный запуск без API). В проде
# global_cidr и gateway_addr нода получает из API при регистрации.
# 100.64.0.0/10 (CGNAT, RFC 6598) — не пересекается с pod/service CIDR и LAN;
# должно совпадать с LIBERATOR_OVERLAY_GLOBAL_CIDR у API.
vpn:
  global_cidr: "100.64.0.0/10"
  gateway_addr: "100.64.0.1"

# Пул QUIC-подключений к остальным нодам. Ноды узнаются из статического списка
# и/или k8s-DNS (headless-сервис), а не gossip-самообучением.
mesh:
  listen_addr: ":9000"
  # headless-сервис k8s: A-записи = IP остальных нод. dns_port — единый quic-порт нод.
  dns_service: "liberator-nodes.default.svc.cluster.local"
  dns_port: 9000
  # запасной список "host:port" для локального dev (без k8s)
  static: []

# TCP-listen ноды: только /healthz и /metrics (Prometheus). Нода пассивная,
# без control-plane и авторизации — находится за закрытым контуром.
server:
  listen_addr: ":8080"

# Восходящий API (control-plane). Нода enroll'ится по одноразовому токену,
# шлёт heartbeat и тянет желаемое состояние (клиенты/правила/квоты) по /v1/node.
api:
  base_url: "http://liberator-api.default.svc.cluster.local:8080"
  region_code: "de"
  public_endpoint: "1.2.3.4:2200" # куда клиентам подключаться (awg listen)
  mesh_endpoint: "liberator-nodes-0.default.svc.cluster.local:9000" # QUIC listen (host:port), форвардинг
  sync_interval: 5s
  heartbeat_interval: 10s

  # Первичная регистрация: одноразовый токен из
  # POST /v1/admin/cluster/enrollment-tokens. После enroll токен не нужен:
  # нода хранит node_id + per-node secret в state_dir/node-identity.json.
  enrollment_token: "CHANGE_ME_enrollment_token"
  node_name: "liberator-node-1"
  zone: "dc1"
  provider: "self-hosted"
  agent_version: "dev"
  labels:
    role: "hybrid"
  state_dir: "/var/lib/liberator"
  # identity_file: "/etc/liberator/node-identity.json" # альтернатива state_dir
