auth:
  # Общий секрет флота: для QUIC-пула между нодами и для node↔API.
  # Должен совпадать с LIBERATOR_NODE_SHARED_SECRET у API.
  # Сгенерировать, напр.: openssl rand -hex 32. Минимум 16 символов.
  secret_key: "CHANGE_ME_random_secret_min_16_chars"

tun:
  mtu: 1376 # Всегда должен быть меньше наименьшего транспорта
  iface_in_name: "liberator"
  iface_out_name: ""
router:
  transports:
    awg:
      type: "awg"

      mtu: 1376
      listen_port: 2200
      # Приватный ключ сервера AmneziaWG (32 байта hex). Сгенерировать свой, не переиспользовать.
      private_key: "CHANGE_ME_32byte_hex_private_key"
      watchdog_interval: "30s"

      h1: "1245955480-1579617642"
      h2: "1827874969-1854585193"
      h3: "2137919667-2143439009"
      h4: "2147159423-2147402519"

      jc: 5
      jmin: 70
      jmax: 120

      s1: 48
      s2: 27
      s3: 30
      s4: 7

# Нужно только когда api.base_url пуст (локальный запуск без API). В проде
# global_cidr и gateway_addr нода получает из API при регистрации.
vpn:
  global_cidr: "10.0.0.0/8"
  gateway_addr: "10.1.0.1"

# Пул QUIC-подключений к остальным нодам. Ноды узнаются из статического списка
# и/или k8s-DNS (headless-сервис), а не gossip-самообучением.
mesh:
  listen_addr: ":9000"
  # headless-сервис k8s: A-записи = IP остальных нод. dns_port — единый quic-порт нод.
  dns_service: "liberator-nodes.default.svc.cluster.local"
  dns_port: 9000
  # запасной список "host:port" для локального dev (без k8s)
  static: []

# TCP-listen ноды: только /healthz и /metrics (Prometheus). Нода пассивная,
# без control-plane и авторизации — находится за закрытым контуром.
server:
  listen_addr: ":8080"

# Восходящий API (control-plane). Нода сама регистрируется, шлёт heartbeat и
# тянет желаемое состояние (клиенты/правила/квоты) по контракту /v1/ctrl.
api:
  base_url: "http://liberator-api.default.svc.cluster.local:8080"
  region_code: "de"
  public_endpoint: "1.2.3.4:2200" # куда клиентам подключаться (awg listen)
  mesh_endpoint: "liberator-nodes-0.default.svc.cluster.local:9000" # QUIC listen (host:port), форвардинг
  sync_interval: 5s
  heartbeat_interval: 10s
