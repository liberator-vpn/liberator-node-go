auth:
  # Общий secret: control-plane и QUIC-пул между нодами. Генерируется в k8s secret.
  # Сгенерировать, напр.: openssl rand -hex 32. Минимум 16 символов.
  secret_key: "CHANGE_ME_random_secret_min_16_chars"

tun:
  mtu: 1376 # Всегда должен быть меньше наименьшего транспорта
  iface_in_name: "liberator"
  iface_out_name: ""
router:
  transports:
    awg:
      type: "awg"

      mtu: 1376
      listen_port: 2200
      # Приватный ключ сервера AmneziaWG (32 байта hex). Сгенерировать свой, не переиспользовать.
      private_key: "CHANGE_ME_32byte_hex_private_key"
      watchdog_interval: "30s"

      h1: "1245955480-1579617642"
      h2: "1827874969-1854585193"
      h3: "2137919667-2143439009"
      h4: "2147159423-2147402519"

      jc: 5
      jmin: 70
      jmax: 120

      s1: 48
      s2: 27
      s3: 30
      s4: 7

# Распределённая виртуальная VPN-сеть. global_cidr обязан быть одинаковым на всех
# нодах; gateway_addr — единственный overlay IP этой ноды из global_cidr.
# Пока это config-фид, в дальнейшем приходит из API в state.
vpn:
  global_cidr: "10.0.0.0/8"
  gateway_addr: "10.1.0.1"

# Пул QUIC-подключений к остальным нодам. Ноды узнаются не gossip-самообучением,
# а из статического списка и/или k8s-DNS (headless-сервис).
mesh:
  listen_addr: ":9000"
  # headless-сервис k8s: A-записи = IP остальных нод. dns_port — единый quic-порт нод.
  dns_service: "liberator-nodes.default.svc.cluster.local"
  dns_port: 9000
  # запасной список "host:port" для локального dev (без k8s)
  static: []

# Желаемые клиенты ноды (config-фид; позже приходят из API в state).
# vpn:
#   clients:
#     - virtual_ip: "10.1.0.2"
#       awg_public_key: "<client pubkey hex>"
#       speed_limit_mbps: 10
#       rules:
#         - protocol: "tcp"
#           port_range_start: 1
#           port_range_end: 65535

api:
  grpc:
    listen_addr: ":9001"
  http:
    listen_addr: ":8080"
