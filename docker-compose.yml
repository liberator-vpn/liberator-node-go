
services:
  liberator:
    build: .
    container_name: liberator
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - "/dev/net/tun:/dev/net/tun"
      - "./config.yaml:/app/config.yaml:ro"
      - "./state:/var/lib/liberator"
    command: ["/app/config.yaml"]
      